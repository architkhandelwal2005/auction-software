<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Spectator Screen — Pro Auction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #09090b; color: white; }
        .fredoka { font-family: 'Fredoka', sans-serif; }
        .space-grotesk { font-family: 'Space Grotesk', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bidPop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .shimmer-text { background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b, #d97706, #f59e0b); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; }
        .anim-slideUp { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-bidPop { animation: bidPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .glass-card { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(63, 63, 70, 0.5); }
        .bid-glow { text-shadow: 0 0 60px rgba(245, 158, 11, 0.3), 0 0 120px rgba(245, 158, 11, 0.1); }
        
        /* ── Cinematic Reveal Animations ── */
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes dramaticZoom { 0% { opacity: 0; transform: scale(0); } 70% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes slamIn { 0% { opacity: 0; transform: translateY(80px) scale(1.3); } 60% { opacity: 1; transform: translateY(-8px) scale(1); } 80% { transform: translateY(3px); } 100% { transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardGlow { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } 50% { box-shadow: 0 0 60px 10px rgba(var(--accent-rgb), 0.15); } 100% { box-shadow: 0 0 30px 5px rgba(var(--accent-rgb), 0.08); } }
        @keyframes revealPulse { 0%, 100% { opacity: 0.03; } 50% { opacity: 0.06; } }

        .anim-slideInLeft { opacity: 0; animation: slideInLeft 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .anim-slideInRight { opacity: 0; animation: slideInRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .anim-dramaticZoom { opacity: 0; animation: dramaticZoom 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-slamIn { opacity: 0; animation: slamIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .anim-fadeInUp { opacity: 0; animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .anim-cardGlow { animation: cardGlow 1.5s ease-out forwards; }

        @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .ticker-text { white-space: nowrap; animation: ticker 25s linear infinite; padding-right: 50px; }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SPORT_THEMES = {
            cricket: { id: 'cricket', name: 'Cricket', emoji: '🏏', accent: '#f59e0b', accentName: 'amber',
                bg: 'radial-gradient(ellipse at 50% 120%, #1a3a1a 0%, #0a1f0a 40%, #050d05 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(245,158,11,0.06) 0%, transparent 60%)',
                cardStyle: 'trading_card' },
            football: { id: 'football', name: 'Football', emoji: '⚽', accent: '#22c55e', accentName: 'green',
                bg: 'radial-gradient(ellipse at 50% 120%, #0a2e0a 0%, #061a06 40%, #030d03 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(34,197,94,0.06) 0%, transparent 60%)',
                cardStyle: 'broadcast_banner' },
            badminton: { id: 'badminton', name: 'Badminton', emoji: '🏸', accent: '#3b82f6', accentName: 'blue',
                bg: 'radial-gradient(ellipse at 50% 120%, #0a1a3a 0%, #060f2a 40%, #030818 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(59,130,246,0.06) 0%, transparent 60%)',
                cardStyle: 'spotlight' },
            pickleball: { id: 'pickleball', name: 'Pickleball', emoji: '🏓', accent: '#14b8a6', accentName: 'teal',
                bg: 'radial-gradient(ellipse at 50% 120%, #0a2a2a 0%, #061a1a 40%, #030d0d 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(20,184,166,0.06) 0%, transparent 60%)',
                cardStyle: 'spotlight' },
            basketball: { id: 'basketball', name: 'Basketball', emoji: '🏀', accent: '#f97316', accentName: 'orange',
                bg: 'radial-gradient(ellipse at 50% 120%, #2a1a0a 0%, #1a0f06 40%, #0d0803 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(249,115,22,0.06) 0%, transparent 60%)',
                cardStyle: 'trading_card' },
            esports: { id: 'esports', name: 'Esports', emoji: '🎮', accent: '#a855f7', accentName: 'purple',
                bg: 'radial-gradient(ellipse at 50% 120%, #1a0a2e 0%, #0f061a 40%, #08030d 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(168,85,247,0.06) 0%, transparent 60%)',
                cardStyle: 'broadcast_banner' },
            art: { id: 'art', name: 'Art & Antiques', emoji: '🎨', accent: '#ef4444', accentName: 'red',
                bg: 'radial-gradient(ellipse at 50% 120%, #2a0a0a 0%, #1a0606 40%, #0d0303 100%)',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(239,68,68,0.06) 0%, transparent 60%)',
                cardStyle: 'spotlight' },
            multi_sport: { id: 'multi_sport', name: 'Multi-Sport / General', emoji: '⭐', accent: '#f59e0b', accentName: 'amber',
                bg: '#09090b',
                overlay: 'radial-gradient(circle at 50% 0%, rgba(245,158,11,0.04) 0%, transparent 60%)',
                cardStyle: 'spotlight' },
        };

        const PALETTE = ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#f97316', '#06b6d4', '#14b8a6', '#ef4444', '#84cc16', '#a855f7', '#6366f1'];
        const getCatColor = (category) => {
            if (!category) return '#71717a';
            let hash = 0;
            for (let i = 0; i < category.length; i++) {
                hash = category.charCodeAt(i) + ((hash << 5) - hash);
            }
            return PALETTE[Math.abs(hash) % PALETTE.length];
        };

        const PlayerPhoto = ({ url, name, size = 44 }) => {
            const [imgError, setImgError] = useState(false);
            useEffect(() => { setImgError(false); }, [url]);
            const initials = (name || '?').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
            const color = colors[(name || '').charCodeAt(0) % colors.length];
            if (url && !imgError) return <img src={url} alt={name} onError={() => setImgError(true)} style={{ width: size, height: size, borderRadius: '50%', objectFit: 'cover', border: '3px solid rgba(255,255,255,0.2)', boxShadow: '0 2px 8px rgba(0,0,0,0.3)' }} />;
            return <div style={{ width: size, height: size, borderRadius: '50%', background: color, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 800, fontSize: size * 0.35, border: '3px solid rgba(255,255,255,0.2)', boxShadow: '0 2px 8px rgba(0,0,0,0.3)' }}>{initials}</div>;
        };

        const CatBadge = ({ category }) => {
            const color = getCatColor(category);
            return <span className="text-[0.65rem] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full" style={{ background: color + '25', color: color, border: `1px solid ${color}50` }}>{category}</span>;
        };

        const PlayerAttributesBadges = ({ attributes, max = 5, className = "" }) => {
            if (!attributes || typeof attributes !== 'object') return null;
            const entries = Object.entries(attributes).filter(([k, v]) => {
                if (v === null || v === undefined || String(v).trim() === '') return false;
                const kl = k.toLowerCase();
                return !['name', 'photo', 'id', 'category', 'base_price', 'photo_url', 'team_id', 'sold_price', 'status', 'sold_at'].includes(kl);
            });
            if (entries.length === 0) return null;

            return (
                <div className={`flex flex-wrap items-center gap-1.5 ${className}`}>
                    {entries.slice(0, max).map(([key, val]) => (
                        <span key={key} className="text-[0.65rem] bg-zinc-900/90 text-zinc-300 border border-zinc-800 px-2 py-0.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm">
                            <span className="text-zinc-500 font-bold uppercase text-[0.55rem]">{key}:</span>
                            <span className="text-white font-bold">{String(val)}</span>
                        </span>
                    ))}
                </div>
            );
        };

        function LiveView() {
            const [data, setData] = useState(null);
            const [activeTab, setActiveTab] = useState('stage'); // stage, teams, remaining, sold, leaderboard
            const [searchQuery, setSearchQuery] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('all');
            const [selectedTeam, setSelectedTeam] = useState(null);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [revealPhase, setRevealPhase] = useState(6);
            const [lastPlayerId, setLastPlayerId] = useState(null);

            const loadData = async () => {
                try {
                    const res = await fetch('/api/live_data');
                    if (res.ok) {
                        const d = await res.json();
                        setData(d);
                        
                        // Check if a new player has appeared on stage for animation
                        if (d.auction_state?.current_player) {
                            if (d.auction_state.current_player !== lastPlayerId) {
                                setLastPlayerId(d.auction_state.current_player);
                                setRevealPhase(0);
                                setTimeout(() => setRevealPhase(1), 500);
                                setTimeout(() => setRevealPhase(2), 1200);
                                setTimeout(() => setRevealPhase(3), 2000);
                                setTimeout(() => setRevealPhase(4), 2800);
                                setTimeout(() => setRevealPhase(5), 3500);
                                setTimeout(() => setRevealPhase(6), 3600);
                            }
                        } else {
                            setLastPlayerId(null);
                        }
                    }
                } catch (e) { }
            };

            useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 2000);
                return () => clearInterval(interval);
            }, [lastPlayerId]);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    setIsFullscreen(true);
                } else {
                    document.exitFullscreen().catch(() => {});
                    setIsFullscreen(false);
                }
            };

            if (!data) return <div className="min-h-screen bg-[#09090b] flex items-center justify-center"><div className="text-center"><div className="text-5xl mb-3 animate-bounce">🔨</div><p className="fredoka text-xl text-amber-500/80">Connecting to auction...</p></div></div>;

            const state = data.auction_state || {};
            const isBiddingActive = !!state.current_player;
            const teams = data.teams || [];
            const soldPlayers = data.sold_players || [];
            const unsoldPlayers = data.unsold_players || [];
            const stats = data.stats || {};
            const categoriesStats = stats.categories || [];
            const eventName = data.config?.event_name || 'Live Auction';

            
            const getTickerContent = () => {
                if (!soldPlayers || soldPlayers.length === 0) return "🔥 Welcome to the Live Auction! Get ready for the first bid.";
                
                const sorted = [...soldPlayers].sort((a, b) => b.sold_price - a.sold_price);
                const topOverall = sorted[0];
                
                const catRecords = {};
                sorted.forEach(p => {
                    if (p.category && !catRecords[p.category]) catRecords[p.category] = p;
                });
                
                const latest = [...soldPlayers].reverse().slice(0, 3);
                
                let parts = [];
                parts.push(`🏆 OVERALL RECORD: ${topOverall.name} (${topOverall.team_name}) - ${topOverall.sold_price}L`);
                
                const catKeys = Object.keys(catRecords).slice(0, 4);
                catKeys.forEach(c => {
                    if (catRecords[c].sold_price > 0) parts.push(`🏅 TOP ${c.toUpperCase()}: ${catRecords[c].name} - ${catRecords[c].sold_price}L`);
                });
                
                latest.forEach(p => {
                    parts.push(`⚡ LATEST: ${p.name} sold to ${p.team_name} for ${p.sold_price}L`);
                });
                
                return parts.join('   •   ');
            };

            // Filter remaining
            const filteredUnsold = unsoldPlayers.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCat = categoryFilter === 'all' || p.category === categoryFilter;
                return matchesSearch && matchesCat;
            });

            const allCategories = [...new Set(unsoldPlayers.map(p => p.category).filter(Boolean))];

            return (
                <div className="min-h-screen flex flex-col pb-10 text-white selection:bg-amber-500/30"
                     style={{ background: currentTheme.bg, '--accent-rgb': currentTheme.accent === '#f59e0b' ? '245,158,11' : currentTheme.accent === '#22c55e' ? '34,197,94' : '59,130,246' }}>
                    <div className="fixed inset-0 pointer-events-none z-0" style={{ background: currentTheme.overlay }}></div>

                    {/* Header */}
                    <header className="bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/50 sticky top-0 z-30 px-4 md:px-6 py-3 md:py-3.5 flex flex-col gap-3 md:gap-4 shadow-lg">
                        
                        <div className="flex justify-between items-start md:items-center w-full">
                            <div className="flex items-center gap-3 md:gap-4">
                                <div className="w-10 h-10 md:w-11 md:h-11 rounded-2xl flex items-center justify-center text-lg md:text-xl shadow-lg shrink-0 border"
                                     style={{ background: `${currentTheme.accent}20`, borderColor: `${currentTheme.accent}40`, color: currentTheme.accent, boxShadow: `0 0 20px ${currentTheme.accent}20` }}>
                                     {currentTheme.emoji}
                                </div>
                                <div className="min-w-0">
                                    <h1 className="fredoka text-lg md:text-xl font-bold truncate" style={{color: currentTheme.accent}}>{eventName}</h1>
                                    <div className="flex items-center gap-1.5 md:gap-2 mt-0.5">
                                        <div className="w-2 h-2 bg-red-500 rounded-full animate-pulse shrink-0"></div>
                                        <span className="text-[0.55rem] md:text-[0.65rem] font-extrabold uppercase tracking-widest text-red-400 whitespace-nowrap">Live Feed</span>
                                        <span className="text-zinc-600 hidden sm:inline">•</span>
                                        <span className="text-[0.55rem] md:text-[0.65rem] font-bold text-zinc-400 hidden sm:inline">Auto-updating</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 shrink-0">
                                <button onClick={toggleFullscreen} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 md:px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center border border-zinc-700 h-10 md:h-11">
                                    <i className={`fa-solid ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex items-center gap-1.5 bg-zinc-950/80 p-1 rounded-2xl border border-zinc-800/50 w-full overflow-x-auto hide-scrollbar">
                            {[
                                { id: 'stage', label: '🎯 Live Stage', highlight: isBiddingActive },
                                { id: 'teams', label: `🛡️ Teams (${teams.length})` },
                                { id: 'remaining', label: `⏳ Pool (${unsoldPlayers.length})` },
                                { id: 'sold', label: `🏆 Sold (${soldPlayers.length})` },
                                { id: 'leaderboard', label: '📊 Stats' }
                            ].map(t => (
                                <button
                                    key={t.id}
                                    onClick={() => setActiveTab(t.id)}
                                    className={`px-3 md:px-4 py-2 rounded-xl text-[0.65rem] md:text-xs font-extrabold uppercase tracking-wider transition-all flex items-center gap-1.5 shrink-0 ${
                                        activeTab === t.id
                                            ? 'text-black shadow-lg'
                                            : 'text-zinc-400 hover:text-white hover:bg-zinc-800/80'
                                    }`}
                                    style={activeTab === t.id ? {background: currentTheme.accent, boxShadow: `0 4px 15px ${currentTheme.accent}40`} : {}}
                                >
                                    {t.label}
                                    {t.highlight && <span className="w-2 h-2 bg-red-600 rounded-full animate-ping shrink-0"></span>}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 max-w-[1700px] w-full mx-auto relative z-10">
                        {/* TAB 1: LIVE STAGE */}
                        {activeTab === 'stage' && (
                            <div className="space-y-6">
                                {/* Top Banner: Active Bidder Stage */}
                                {isBiddingActive ? (
                                    <div className={`relative overflow-hidden rounded-3xl bg-zinc-950/80 backdrop-blur-2xl border border-zinc-700/50 p-10 transition-all duration-1000 ${revealPhase >= 0 ? 'anim-cardGlow opacity-100' : 'opacity-0 scale-95'}`}
                                         style={revealPhase >= 0 ? {boxShadow: `0 0 100px rgba(0,0,0,0.6)`} : {}}>
                                         
                                        {/* Watermark Background Emoji */}
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[15rem] opacity-5 pointer-events-none select-none grayscale" style={{animation: 'revealPulse 4s infinite'}}>{currentTheme.emoji}</div>

                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 relative z-10">
                                            <div className="flex items-center gap-2 border px-4 py-1 rounded-full" style={{background: `${currentTheme.accent}20`, borderColor: `${currentTheme.accent}40`}}>
                                                <div className="w-2 h-2 rounded-full animate-ping" style={{background: currentTheme.accent}}></div>
                                                <span className="fredoka text-xs font-bold uppercase tracking-widest" style={{color: currentTheme.accent}}>Under the Hammer</span>
                                            </div>
                                        </div>

                                        <div className="flex flex-col md:flex-row items-center justify-between gap-8 mt-4 relative z-10">
                                            {/* Player Details */}
                                            <div className="flex items-center gap-6">
                                                <div className={`relative shrink-0 ${revealPhase >= 3 ? 'anim-dramaticZoom' : 'opacity-0 hidden'}`}>
                                                    <div className="absolute inset-0 rounded-full blur-2xl opacity-40" style={{background: currentTheme.accent}}></div>
                                                    <div className="relative z-10 border-4 rounded-full overflow-hidden shadow-2xl" style={{borderColor: currentTheme.accent}}>
                                                        <PlayerPhoto url={state.photo_url} name={state.current_player} size={150} />
                                                    </div>
                                                </div>
                                                <div>
                                                    <div className={`mb-3 ${revealPhase >= 1 ? 'anim-slideInLeft' : 'opacity-0'}`}>
                                                        {state.category && <span className="px-3 py-1 rounded-full font-black text-[0.65rem] uppercase tracking-widest text-black shadow-lg" style={{background: currentTheme.accent}}>{state.category}</span>}
                                                    </div>
                                                    <div className={`${revealPhase >= 4 ? 'anim-slamIn' : 'opacity-0'}`}>
                                                        <h2 className="fredoka text-5xl md:text-6xl font-black text-white tracking-tight uppercase" style={{textShadow: `0 4px 20px ${currentTheme.accent}40`}}>{state.current_player}</h2>
                                                    </div>
                                                    {state.base_price && (
                                                        <div className={`mt-3 text-zinc-400 font-bold text-sm ${revealPhase >= 5 ? 'anim-fadeInUp' : 'opacity-0'}`}>
                                                            Base Price: <span className="text-white font-bold">₹{state.base_price} Lakhs</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Live Bid */}
                                            <div className={`text-center md:text-right ${revealPhase >= 5 ? 'anim-fadeInUp' : 'opacity-0'}`}>
                                                <p className="fredoka text-zinc-400 text-xs font-bold mb-2 uppercase tracking-[0.3em]">Current Live Bid</p>
                                                <div className="fredoka text-[5rem] md:text-[6.5rem] leading-none font-black tracking-tight" style={{color: currentTheme.accent, textShadow: `0 0 40px ${currentTheme.accent}40`}}>
                                                    ₹{state.current_bid}L
                                                </div>
                                            </div>
                                        </div>

                                        {/* Attributes Row */}
                                        <div className="mt-8 border-t border-zinc-800 pt-6 relative z-10">
                                            <div className={`${revealPhase >= 2 ? 'anim-slideInRight' : 'opacity-0'}`}>
                                                <PlayerAttributesBadges attributes={state.attributes} max={8} className="justify-start md:justify-center" />
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="rounded-3xl bg-zinc-950/80 backdrop-blur-2xl border border-zinc-800/50 p-16 text-center shadow-2xl flex flex-col items-center">
                                        <div className="w-32 h-32 rounded-full flex items-center justify-center border-2 mb-6" style={{borderColor: currentTheme.accent, background: `${currentTheme.accent}20`, boxShadow: `0 0 60px ${currentTheme.accent}40`}}>
                                            <span className="text-6xl filter drop-shadow-xl animate-bounce">{currentTheme.emoji}</span>
                                        </div>
                                        <h2 className="fredoka text-4xl font-bold text-white tracking-wide" style={{textShadow: `0 2px 10px ${currentTheme.accent}60`}}>Auction Stage Ready</h2>
                                        <p className="text-zinc-400 text-sm mt-3 font-semibold tracking-wider uppercase">Waiting for the auctioneer to draw the next player...</p>
                                    </div>
                                )}

                                {/* Quick Franchise HUD */}
                                <div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                                        <h3 className="fredoka text-lg font-bold text-zinc-300 flex items-center gap-2">
                                            🛡️ Franchise Purses & Squads
                                        </h3>
                                        <span className="text-xs font-bold text-zinc-500">Click any team for full squad</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {teams.map(t => {
                                            const pct = Math.max(0, Math.min(100, (t.remaining_budget / t.total_budget) * 100));
                                            return (
                                                <div
                                                    key={t.id}
                                                    onClick={() => setSelectedTeam(t)}
                                                    className="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 hover:border-amber-500/50 hover:bg-zinc-800 hover:translate-y-[-2px] transition-all duration-300 cursor-pointer group shadow-lg"
                                                >
                                                    <div className="flex justify-between items-start mb-2.5">
                                                        <div className="flex items-center gap-2.5">
                                                            <div className="w-8 h-8 rounded-xl flex items-center justify-center text-white fredoka font-bold text-sm shadow" style={{ background: t.color || '#3b82f6' }}>
                                                                {t.logo_url ? <img src={t.logo_url} className="w-6 h-6 object-contain" /> : t.name[0]}
                                                            </div>
                                                            <div>
                                                                <h4 className="font-extrabold text-white text-sm truncate max-w-[120px]">{t.name}</h4>
                                                                <span className="text-[0.6rem] text-zinc-400 font-bold">{t.player_count || 0}/{t.target_squad_size || 10} players</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-[0.55rem] text-amber-400 font-bold uppercase">Max Bid</div>
                                                            <div className="fredoka font-bold text-base text-amber-300">
                                                                ₹{t.max_allowed_bid}L
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="bg-zinc-800 rounded-full h-1.5 overflow-hidden mb-2">
                                                        <div className={`h-full rounded-full transition-all duration-700 ${pct > 50 ? 'bg-gradient-to-r from-green-500 to-emerald-400' : pct > 20 ? 'bg-gradient-to-r from-yellow-500 to-amber-400' : 'bg-gradient-to-r from-red-500 to-rose-400'}`} style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                    <div className="flex justify-between text-[0.65rem] text-zinc-400 font-bold">
                                                        <span>Purse: <strong className="text-white">₹{t.remaining_budget}L</strong></span>
                                                        <span>Needs: <strong className="text-amber-400">{t.needed_players || 0}</strong></span>
                                                    </div>
                                                    {/* Requirements tags */}
                                                    {t.fulfillment && t.fulfillment.filter(f => f.min > 0).length > 0 && (
                                                        <div className="flex flex-wrap gap-1 mt-2">
                                                            {t.fulfillment.filter(f => f.min > 0).map((f, fi) => (
                                                                <span key={fi} className={`text-[0.5rem] font-extrabold px-1.5 py-0.5 rounded-full ${f.have > f.min ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : f.met ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-orange-500/20 text-orange-400 border border-orange-500/30'}`}>
                                                                    {f.category}: {f.have}/{f.min} {f.have > f.min ? '✨' : f.met ? '✓' : '⚠️'}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: TEAMS & SQUADS */}
                        {activeTab === 'teams' && (
                            <div className="grid grid-cols-1 md:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 anim-slideUp">
                                {teams.map(t => {
                                    const pct = Math.max(0, Math.min(100, (t.remaining_budget / t.total_budget) * 100));
                                    return (
                                        <div key={t.id} className="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-xl space-y-4 hover:translate-y-[-2px] transition-all duration-300 hover:border-zinc-700">
                                            <div className="flex justify-between items-start pb-3 border-b border-zinc-800">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-white fredoka font-bold text-xl shadow-lg" style={{ background: t.color || '#3b82f6' }}>
                                                        {t.logo_url ? <img src={t.logo_url} className="w-9 h-9 object-contain" /> : t.name[0]}
                                                    </div>
                                                    <div>
                                                        <h3 className="fredoka text-xl font-bold text-white">{t.name}</h3>
                                                        <p className="text-xs text-zinc-400 font-bold">{t.player_count || 0}/{t.target_squad_size || 10} players • ₹{(t.total_budget - t.remaining_budget).toFixed(1)}L spent</p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[0.6rem] text-amber-400 font-extrabold uppercase">Max Allowed Bid</div>
                                                    <div className="fredoka text-2xl font-bold text-amber-300">₹{t.max_allowed_bid}L</div>
                                                </div>
                                            </div>

                                            {/* Purse & Reserved breakdown */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 bg-zinc-950 p-3 rounded-2xl border border-zinc-800 text-xs">
                                                <div>
                                                    <span className="text-[0.6rem] text-zinc-500 font-extrabold uppercase block">Remaining Purse</span>
                                                    <span className={`fredoka text-base font-bold ${pct > 20 ? 'text-green-400' : 'text-red-400'}`}>₹{t.remaining_budget}L</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[0.6rem] text-zinc-500 font-extrabold uppercase block">Reserved Purse</span>
                                                    <span className="fredoka text-sm font-bold text-amber-400">₹{t.reserved_purse}L <span className="text-[0.6rem] text-zinc-400">({t.reserved_spots} spots)</span></span>
                                                </div>
                                            </div>

                                            {/* Budget progress bar */}
                                            <div className="bg-zinc-800 rounded-full h-2 overflow-hidden">
                                                <div className={`h-full rounded-full transition-all duration-700 ${pct > 50 ? 'bg-green-400' : pct > 20 ? 'bg-yellow-400' : 'bg-red-400'}`} style={{ width: `${pct}%` }}></div>
                                            </div>

                                            {/* Squad members */}
                                            <div>
                                                <h4 className="text-xs font-extrabold text-zinc-400 uppercase tracking-widest mb-2.5">Squad Roster ({t.players?.length || 0})</h4>
                                                {(!t.players || t.players.length === 0) ? (
                                                    <p className="text-xs text-zinc-600 font-bold py-3 text-center">No players bought yet</p>
                                                ) : (
                                                    <div className="space-y-2 max-h-52 overflow-y-auto custom-scrollbar pr-1">
                                                        {t.players.map(p => (
                                                            <div key={p.id} className="flex items-center gap-3 p-2 bg-zinc-950/60 rounded-xl border border-zinc-800/80">
                                                                <PlayerPhoto url={p.photo_url} name={p.name} size={32} />
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="font-bold text-white text-xs truncate">{p.name}</div>
                                                                    <div className="flex items-center gap-1 mt-0.5">
                                                                        {p.category && <CatBadge category={p.category} />}
                                                                    </div>
                                                                    {p.attributes && <PlayerAttributesBadges attributes={p.attributes} max={2} className="mt-1" />}
                                                                </div>
                                                                <div className="fredoka font-bold text-amber-400 text-xs">₹{p.sold_price}L</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB 3: REMAINING POOL */}
                        {activeTab === 'remaining' && (
                            <div className="space-y-6 anim-slideUp">
                                {/* Search & Filters */}
                                <div className="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex flex-col md:flex-row gap-4 items-center justify-between">
                                    <div className="relative w-full md:w-80">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
                                        <input
                                            type="text"
                                            placeholder="Search players..."
                                            className="w-full bg-zinc-950 border border-zinc-700 text-white pl-9 pr-4 py-2 rounded-xl text-sm font-bold focus:border-amber-500 outline-none"
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {['all', ...allCategories].map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setCategoryFilter(cat)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wider transition ${
                                                    categoryFilter === cat
                                                        ? 'bg-amber-600 text-white'
                                                        : 'bg-zinc-800 text-zinc-400 hover:text-white hover:bg-zinc-700'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Player Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3.5">
                                    {filteredUnsold.map(p => (
                                        <div key={p.id} className="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 flex flex-col items-center text-center hover:border-amber-500/50 hover:translate-y-[-2px] transition-all duration-300">
                                            <PlayerPhoto url={p.photo_url} name={p.name} size={64} />
                                            <h4 className="font-extrabold text-white text-sm mt-3 line-clamp-1">{p.name}</h4>
                                            <div className="mt-1.5">{p.category && <CatBadge category={p.category} />}</div>
                                            {p.attributes && <PlayerAttributesBadges attributes={p.attributes} max={2} className="mt-1.5 justify-center" />}
                                            <div className="mt-2 text-xs text-zinc-400 font-bold bg-zinc-950 px-3 py-1 rounded-full border border-zinc-800">
                                                Base: <span className="text-white font-bold">₹{p.base_price}L</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: SOLD PLAYERS */}
                        {activeTab === 'sold' && (
                            <div className="space-y-4 anim-slideUp">
                                <div className="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center">
                                    <h3 className="fredoka text-lg font-bold text-white">🏆 Sold Players Feed ({soldPlayers.length})</h3>
                                    <span className="text-xs text-zinc-400 font-bold">Total Spent: <span className="text-amber-400 font-bold">₹{stats.spent || 0}L</span></span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {soldPlayers.map(p => (
                                        <div key={p.id} className="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 flex items-center gap-4 hover:border-amber-500/30 hover:translate-y-[-2px] transition-all duration-300">
                                            <PlayerPhoto url={p.photo_url} name={p.name} size={50} />
                                            <div className="flex-1 min-w-0">
                                                <div className="font-extrabold text-white text-sm truncate">{p.name}</div>
                                                <div className="flex items-center gap-2 mt-1">
                                                    {p.category && <CatBadge category={p.category} />}
                                                    <span className="text-xs text-zinc-400 font-bold">→ {p.team_name}</span>
                                                </div>
                                                {p.attributes && <PlayerAttributesBadges attributes={p.attributes} max={2} className="mt-1" />}
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[0.6rem] text-zinc-500 font-bold uppercase">Sold for</div>
                                                <div className="fredoka text-xl font-bold text-amber-400">₹{p.sold_price}L</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 5: LEADERBOARD & STATS */}
                        {activeTab === 'leaderboard' && (
                            <div className="space-y-6 anim-slideUp">
                                {/* Feature 6: Category Spending Analytics Cards */}
                                {categoriesStats.length > 0 && (
                                    <div className="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 space-y-4 shadow-xl hover:border-zinc-700 transition">
                                        <div className="flex justify-between items-center">
                                            <h3 className="fredoka text-xl font-bold text-amber-400 flex items-center gap-2">
                                                📊 Category Spending Distribution
                                            </h3>
                                            <span className="text-xs text-zinc-400 font-bold">Total Spend: ₹{stats.spent || 0}L</span>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 md:grid-cols-4 lg:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-3">
                                            {categoriesStats.map((c, i) => (
                                                <div key={i} className="p-4 bg-zinc-950/70 rounded-2xl border border-zinc-800 space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-extrabold text-xs text-white truncate">{c.category}</span>
                                                        <span className="text-[0.65rem] text-zinc-400 font-bold">{c.sold_count}/{c.total}</span>
                                                    </div>
                                                    <div className="fredoka text-xl font-bold text-amber-400">₹{c.total_spent}L</div>
                                                    <div className="bg-zinc-800 rounded-full h-1.5 overflow-hidden">
                                                        <div className="h-full bg-amber-500 rounded-full" style={{ width: `${c.percent_of_total}%` }}></div>
                                                    </div>
                                                    <div className="flex justify-between text-[0.6rem] text-zinc-500 font-bold">
                                                        <span>Avg: ₹{c.avg_price}L</span>
                                                        <span>{c.percent_of_total}%</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Top 5 Expensive Buys */}
                                    <div className="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 space-y-4 shadow-xl hover:border-zinc-700 transition">
                                        <h3 className="fredoka text-xl font-bold text-yellow-400 flex items-center gap-2">
                                            👑 Top 5 Most Expensive Players
                                        </h3>
                                        {(!stats.top_buys || stats.top_buys.length === 0) ? (
                                            <p className="text-sm text-zinc-500 font-bold text-center py-8">No players sold yet</p>
                                        ) : (
                                            <div className="space-y-3">
                                                {stats.top_buys.map((b, i) => (
                                                    <div key={i} className="flex items-center gap-3 p-3 bg-zinc-950/70 rounded-2xl border border-zinc-800">
                                                        <div className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${i === 0 ? 'bg-yellow-400 text-black' : i === 1 ? 'bg-zinc-300 text-black' : i === 2 ? 'bg-amber-600 text-white' : 'bg-zinc-800 text-zinc-400'}`}>
                                                            #{i + 1}
                                                        </div>
                                                        <PlayerPhoto url={b.photo_url} name={b.name} size={36} />
                                                        <div className="flex-1 min-w-0">
                                                            <div className="font-extrabold text-white text-sm truncate">{b.name}</div>
                                                            <div className="text-xs text-zinc-400 font-bold">{b.team_name}</div>
                                                        </div>
                                                        <div className="fredoka text-lg font-bold text-amber-400">₹{b.sold_price}L</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Budget Standings */}
                                    <div className="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 space-y-4 shadow-xl hover:border-zinc-700 transition">
                                        <h3 className="fredoka text-xl font-bold text-orange-400 flex items-center gap-2">
                                            💰 Franchise Budget Remaining
                                        </h3>
                                        <div className="space-y-3">
                                            {[...teams].sort((a, b) => b.remaining_budget - a.remaining_budget).map((t, i) => (
                                                <div key={t.id} className="p-3 bg-zinc-950/70 rounded-2xl border border-zinc-800 space-y-2">
                                                    <div className="flex justify-between items-center text-sm font-bold">
                                                        <span className="text-white flex items-center gap-2">
                                                            <span className="text-zinc-500 text-xs">#{i + 1}</span> {t.name}
                                                        </span>
                                                        <span className="fredoka text-amber-400">₹{t.remaining_budget}L</span>
                                                    </div>
                                                    <div className="bg-zinc-800 rounded-full h-2 overflow-hidden">
                                                        <div className="h-full bg-orange-500 rounded-full" style={{ width: `${(t.remaining_budget / t.total_budget) * 100}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Team Details Modal */}
                    {selectedTeam && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 anim-fadeIn" onClick={() => setSelectedTeam(null)}>
                            <div className="bg-zinc-900 border border-zinc-700 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 glass-card" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center pb-3 border-b border-zinc-800">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white fredoka font-bold text-base shadow-lg" style={{ background: selectedTeam.color || '#3b82f6' }}>
                                            {selectedTeam.logo_url ? <img src={selectedTeam.logo_url} className="w-8 h-8 object-contain" /> : selectedTeam.name[0]}
                                        </div>
                                        <h3 className="fredoka text-xl font-bold text-white">{selectedTeam.name}</h3>
                                    </div>
                                    <button onClick={() => setSelectedTeam(null)} className="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center transition">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div>
                                    <div className="flex justify-between text-xs font-bold text-zinc-400 mb-1">
                                        <span>Purse: ₹{selectedTeam.remaining_budget}L</span>
                                        <span>Spent: ₹{(selectedTeam.total_budget - selectedTeam.remaining_budget).toFixed(1)}L</span>
                                    </div>
                                </div>
                                <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                                    {(!selectedTeam.players || selectedTeam.players.length === 0) ? (
                                        <p className="text-xs text-zinc-500 font-bold text-center py-6">No players bought yet</p>
                                    ) : (
                                        selectedTeam.players.map(p => (
                                            <div key={p.id} className="flex items-center gap-2.5 p-2 bg-zinc-950 rounded-xl border border-zinc-800">
                                                <PlayerPhoto url={p.photo_url} name={p.name} size={30} />
                                                <span className="font-bold text-white text-xs flex-1 truncate">{p.name}</span>
                                                <span className="fredoka text-amber-400 text-xs font-bold">₹{p.sold_price}L</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                
                    <div className="ticker-wrap">
                        <div className="ticker-text text-sm uppercase">
                            {getTickerContent()}
                        </div>
                    </div>
                </div>
    );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LiveView />);
        {% endraw %}
    </script>
</body>
</html>
