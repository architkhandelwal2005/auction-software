<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Report & Squad Balance Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #f8fafc; color: #1e293b; }
        .fredoka { font-family: 'Fredoka', sans-serif; }
        /* A team's roster should not split across a printed page where it can
           be avoided — the section-level page-break below only guarantees
           Section 3 itself starts on a fresh page. */
        .team-block { break-inside: avoid; page-break-inside: avoid; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; font-size: 11pt; }
            .page-break { page-break-before: always; }
            .shadow-md, .shadow-lg, .shadow-sm { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div id="root"></div>
    <script type="text/babel">
        {% raw %}
        const { useState, useEffect } = React;

        // ── Copied from static/app.jsx ──────────────────────────────────────
        // report.html is a separate, standalone Babel bundle with no import
        // bridge to app.jsx, so its small display helpers are duplicated here
        // rather than shared — matching how the rest of this file already has
        // no dependency on the admin bundle.
        const CAT_COLORS = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#f97316'];
        const getCatColor = (name) => CAT_COLORS[(name || '').charCodeAt(0) % CAT_COLORS.length];

        const CatBadge = ({ category }) => {
            const color = getCatColor(category);
            return <span className="text-[0.65rem] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full" style={{background:color+'25',color:color,border:`1px solid ${color}55`}}>{category || 'General'}</span>;
        };

        const PlayerPhoto = ({ url, name, size = 44 }) => {
            const [imgError, setImgError] = useState(false);
            useEffect(() => { setImgError(false); }, [url]);
            const initials = (name||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
            const bg = CAT_COLORS[(name||'').charCodeAt(0) % CAT_COLORS.length];
            if (url && !imgError) {
                return <img src={url} onError={()=>setImgError(true)} alt={name}
                    style={{width:size,height:size,borderRadius:'50%',objectFit:'cover',border:'2px solid #e2e8f0',flexShrink:0}} />;
            }
            return <div style={{width:size,height:size,borderRadius:'50%',background:bg,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:size*0.35,flexShrink:0}}>{initials}</div>;
        };

        // Team logo (or a colored initial square when there isn't one) — the
        // same fallback pattern used throughout the admin and team dashboards.
        const TeamMark = ({ team, size = 40 }) => (
            <div className="rounded-xl flex items-center justify-center text-white font-bold shrink-0"
                 style={{width:size,height:size,fontSize:size*0.4,background:team.color||'#3b82f6'}}>
                {team.logo_url ? <img src={team.logo_url} style={{width:size*0.8,height:size*0.8,objectFit:'contain'}} /> : (team.name||'?')[0]}
            </div>
        );

        function Report() {
            const [data, setData] = useState(null);
            const [error, setError] = useState('');

            useEffect(() => {
                fetch('/api/report/final')
                    .then(r => r.json().then(d => ({ ok: r.ok, d })))
                    .then(({ ok, d }) => { if (ok) setData(d); else setError(d.message || d.error || 'Could not load the report.'); })
                    .catch(() => setError('Could not reach the server.'));
            }, []);

            if (error) return <div className="text-center py-20 font-bold text-red-500">{error}</div>;
            if (!data) return <div className="text-center py-20 font-bold text-gray-500">Generating Auction Report...</div>;

            const report = data.report || {};
            const retained = !!data.retained;
            const config = report.config || {};
            const teams = report.teams || [];
            const stats = report.stats || {};
            const categories = stats.categories || [];
            const highestSale = (stats.top_buys || [])[0] || null;
            const biggestSpender = stats.most_spent_team || null;
            const eventName = config.event_name || 'Cricket Auction 2026';
            const bannerUrl = config.event_banner;
            const orgName = config.organisation_name || '';
            const orgLogo = config.org_logo || '';

            return (
                <div className="max-w-5xl mx-auto space-y-8">
                    {/* Top Action Bar (hidden when printing) */}
                    <div className="no-print bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <a href="/admin" className="text-blue-600 hover:text-blue-800 font-bold text-sm flex items-center gap-1.5">
                                <i className="fa-solid fa-arrow-left"></i> Dashboard
                            </a>
                            <span className="text-gray-300">|</span>
                            <span className="font-bold text-sm text-gray-600">Official Event Report</span>
                        </div>
                        <div className="flex gap-2">
                            {!retained && <a href="/api/export/csv" className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1.5 border border-gray-200">
                                <i className="fa-solid fa-file-csv"></i> Download CSV
                            </a>}
                            <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-sm">
                                <i className="fa-solid fa-print"></i> Print / Save as PDF
                            </button>
                            <a href="/logout" className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1.5 border border-red-200">
                                <i className="fa-solid fa-right-from-bracket"></i> Logout
                            </a>
                        </div>
                    </div>

                    {/* Official Document Header */}
                    <div className="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm">
                        {bannerUrl && (
                            <img src={bannerUrl} alt="Banner" className="w-full h-32 object-cover rounded-2xl mb-6" />
                        )}
                        <div className="flex justify-between items-start border-b border-gray-200 pb-6">
                            <div>
                                <div className="flex items-center gap-3 mb-2">
                                    {orgLogo && <img src={orgLogo} alt="" className="h-11 w-11 object-contain rounded-lg border border-gray-200 p-0.5" />}
                                    {orgName && <span className="text-sm font-extrabold uppercase tracking-widest text-amber-600">{orgName}</span>}
                                </div>
                                <h1 className="fredoka text-3xl font-bold text-gray-900">{eventName}</h1>
                                <p className="text-gray-500 font-bold text-sm mt-1">Official Auction Summary & Squad Balance Sheet</p>
                                <p className="text-xs text-gray-400 mt-1 font-semibold">Generated on: {new Date().toLocaleString('en-US', { dateStyle: 'full', timeStyle: 'short' })}</p>
                            </div>
                            <div className="text-right">
                                <span className="inline-block bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">
                                    {retained ? 'Archived Report' : 'Final Report'}
                                </span>
                                {retained && <p className="text-[0.65rem] text-gray-400 font-bold mt-1.5 max-w-[180px]">Player photos are no longer stored — every name, price and figure below is unchanged.</p>}
                            </div>
                        </div>

                        {/* Executive Summary Metrics */}
                        <div className="grid grid-cols-4 gap-4 mt-6">
                            <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                                <p className="text-xs text-blue-600 font-extrabold uppercase">Total Pool</p>
                                <p className="fredoka text-2xl font-bold text-blue-900">{stats.total || 0} Players</p>
                            </div>
                            <div className="p-4 bg-green-50 rounded-2xl border border-green-100">
                                <p className="text-xs text-green-600 font-extrabold uppercase">Players Sold</p>
                                <p className="fredoka text-2xl font-bold text-green-900">{stats.sold || 0} Players</p>
                            </div>
                            <div className="p-4 bg-orange-50 rounded-2xl border border-orange-100">
                                <p className="text-xs text-orange-600 font-extrabold uppercase">Unsold Players</p>
                                <p className="fredoka text-2xl font-bold text-orange-900">{stats.unsold || 0} Players</p>
                            </div>
                            <div className="p-4 bg-purple-50 rounded-2xl border border-purple-100">
                                <p className="text-xs text-purple-600 font-extrabold uppercase">Total Spend</p>
                                <p className="fredoka text-2xl font-bold text-purple-900">₹{stats.spent || 0}L</p>
                            </div>
                        </div>
                    </div>

                    {/* Auction Summary: highest sale + biggest spender */}
                    {(highestSale || biggestSpender) && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {highestSale && (
                                <div className="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm flex items-center gap-4">
                                    <PlayerPhoto url={highestSale.photo_url} name={highestSale.name} size={56} />
                                    <div className="flex-1 min-w-0">
                                        <p className="text-xs text-amber-600 font-extrabold uppercase tracking-wider">🏆 Highest Sale of the Auction</p>
                                        <p className="fredoka text-xl font-bold text-gray-900 truncate">{highestSale.name}</p>
                                        <p className="text-xs text-gray-500 font-bold">{highestSale.team_name} {highestSale.category ? `· ${highestSale.category}` : ''}</p>
                                    </div>
                                    <p className="fredoka text-2xl font-bold text-amber-600 shrink-0">₹{highestSale.sold_price}L</p>
                                </div>
                            )}
                            {biggestSpender && (
                                <div className="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm flex items-center gap-4">
                                    <TeamMark team={biggestSpender} size={56} />
                                    <div className="flex-1 min-w-0">
                                        <p className="text-xs text-cyan-600 font-extrabold uppercase tracking-wider">💰 Biggest Spender</p>
                                        <p className="fredoka text-xl font-bold text-gray-900 truncate">{biggestSpender.name}</p>
                                        <p className="text-xs text-gray-500 font-bold">Committed the most of its budget</p>
                                    </div>
                                    <p className="fredoka text-2xl font-bold text-cyan-600 shrink-0">₹{biggestSpender.spent}L</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Section 1: Franchise Summary Table */}
                    <div className="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm space-y-4">
                        <h2 className="fredoka text-xl font-bold text-gray-800">1. Franchise Financial & Squad Standings</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="border-b-2 border-gray-200 text-gray-400 uppercase text-xs">
                                        <th className="py-3 px-2">Franchise</th>
                                        <th className="py-3 px-2 text-right">Total Budget</th>
                                        <th className="py-3 px-2 text-right">Total Spent</th>
                                        <th className="py-3 px-2 text-right">Remaining Purse</th>
                                        <th className="py-3 px-2 text-right text-cyan-600">Max Bid Allowed</th>
                                        <th className="py-3 px-2 text-center">Squad Size</th>
                                        <th className="py-3 px-2 text-right w-32">Purse Used</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {teams.map(t => {
                                        const spent = t.total_budget - t.remaining_budget;
                                        const pct = t.total_budget > 0 ? ((spent / t.total_budget) * 100) : 0;
                                        return (
                                            <tr key={t.id || t.name} className="border-b border-gray-100 font-bold hover:bg-gray-50">
                                                <td className="py-3 px-2">
                                                    <div className="flex items-center gap-2.5">
                                                        <TeamMark team={t} size={26} />
                                                        <span className="text-gray-800">{t.name}</span>
                                                    </div>
                                                </td>
                                                <td className="py-3 px-2 text-right text-gray-600">₹{t.total_budget}L</td>
                                                <td className="py-3 px-2 text-right text-purple-600">₹{spent.toFixed(1)}L</td>
                                                <td className="py-3 px-2 text-right text-green-600">₹{t.remaining_budget}L</td>
                                                <td className="py-3 px-2 text-right text-cyan-600 font-extrabold">₹{t.max_allowed_bid}L</td>
                                                <td className="py-3 px-2 text-center text-gray-800">{t.player_count || 0}/{t.target_squad_size || 10}</td>
                                                <td className="py-3 px-2">
                                                    <div className="flex items-center gap-2 justify-end">
                                                        <span className="text-gray-500 text-xs w-9 text-right">{pct.toFixed(0)}%</span>
                                                        <div className="w-16 h-2 rounded-full bg-gray-100 overflow-hidden shrink-0">
                                                            <div className="h-full rounded-full bg-purple-400" style={{width:`${Math.min(100,pct)}%`}}></div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Section 2: Category Spending Breakdown */}
                    {categories.length > 0 && (
                        <div className="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm space-y-4">
                            <h2 className="fredoka text-xl font-bold text-gray-800">2. Category Spending Breakdown</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {categories.map((c, i) => (
                                    <div key={i} className="p-4 bg-gray-50 rounded-2xl border border-gray-200 space-y-1">
                                        <div className="flex justify-between items-center">
                                            <span className="font-extrabold text-gray-700 text-sm">{c.category}</span>
                                            <span className="text-xs font-bold text-gray-400">{c.sold_count}/{c.total} sold</span>
                                        </div>
                                        <div className="fredoka text-xl font-bold text-gray-900">₹{c.total_spent}L</div>
                                        <div className="flex justify-between text-[0.65rem] text-gray-500 font-bold">
                                            <span>Avg: ₹{c.avg_price}L</span>
                                            <span>{c.percent_of_total}% of spend</span>
                                        </div>
                                        {c.highest_price > 0 && <div className="text-[0.65rem] text-amber-600 font-extrabold pt-0.5 border-t border-gray-200 mt-1">🏆 Highest Bid: ₹{c.highest_price}L</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Section 3: Full Team Squad Rosters (Page break in print) */}
                    <div className="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm space-y-6 page-break">
                        <h2 className="fredoka text-xl font-bold text-gray-800">3. Complete Squad Rosters</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {teams.map(t => {
                                const spent = t.total_budget - t.remaining_budget;
                                const pct = t.total_budget > 0 ? ((spent / t.total_budget) * 100) : 0;
                                return (
                                <div key={t.id || t.name} className="team-block p-5 bg-gray-50 rounded-2xl border border-gray-200 space-y-3">
                                    <div className="flex justify-between items-center border-b border-gray-200 pb-3">
                                        <div className="flex items-center gap-3">
                                            <TeamMark team={t} size={40} />
                                            <div>
                                                <h3 className="fredoka font-bold text-gray-800 text-lg leading-tight">{t.name}</h3>
                                                <p className="text-xs text-gray-500 font-bold">{t.player_count || 0} players &bull; ₹{spent.toFixed(1)}L spent</p>
                                            </div>
                                        </div>
                                        <span className="text-xs font-bold text-gray-500 text-right">Purse Left<br/><span className="text-green-600 text-sm">₹{t.remaining_budget}L</span></span>
                                    </div>
                                    <div className="w-full h-2 rounded-full bg-gray-200 overflow-hidden">
                                        <div className="h-full rounded-full bg-purple-400" style={{width:`${Math.min(100,pct)}%`}}></div>
                                    </div>
                                    {(!t.players || t.players.length === 0) ? (
                                        <p className="text-xs text-gray-400 font-bold py-2">No players acquired</p>
                                    ) : (
                                        /* One column, not two — a two-up grid left too little width for a
                                           full name next to a photo and price, and cut names off mid-word. */
                                        <div className="space-y-2">
                                            {t.players.map((p) => (
                                                <div key={p.id || p.name} className="flex items-center gap-3 p-3 bg-white rounded-xl border border-gray-200">
                                                    <PlayerPhoto url={p.photo_url} name={p.name} size={48} />
                                                    <div className="flex-1 min-w-0 flex items-center gap-2.5 flex-wrap">
                                                        <p className="font-bold text-gray-800 text-base leading-tight">{p.name}</p>
                                                        <CatBadge category={p.category} />
                                                    </div>
                                                    <span className="text-green-600 font-extrabold text-base shrink-0">₹{p.sold_price}L</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Report />);
        {% endraw %}
    </script>
</body>
</html>
