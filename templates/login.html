<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #09090b; color: white; overflow-x: hidden; }
        .fredoka { font-family: 'Fredoka', sans-serif; }
        .card-hover:hover { transform: translateY(-4px); border-color: #f59e0b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950">

    <div class="w-full max-w-4xl">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl flex items-center justify-center text-4xl shadow-lg shadow-amber-500/20 mx-auto mb-4">🔨</div>
            <h1 class="fredoka text-3xl md:text-5xl font-bold text-white mb-2">Auction Portal</h1>
            <p class="text-zinc-400 font-bold tracking-wide uppercase text-sm">Select Your Role to Continue</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Spectator -->
            <button onclick="loginSpectator()" class="card-hover bg-zinc-900 border border-zinc-800 p-8 rounded-3xl transition-all text-left flex flex-col h-full group relative overflow-hidden">
                <div class="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition"></div>
                <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center text-2xl mb-6">📺</div>
                <h2 class="fredoka text-2xl font-bold text-white mb-2">Spectator</h2>
                <p class="text-zinc-500 text-sm mb-6 flex-1">View the live auction stage and follow the bidding action in real-time.</p>
                <div class="text-blue-400 font-bold text-sm flex items-center gap-2">Enter Live Feed <i class="fa-solid fa-arrow-right"></i></div>
            </button>

            <!-- Team Owner -->
            <div id="team-card" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl text-left flex flex-col h-full relative">
                <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-2xl mb-6">🛡️</div>
                <h2 class="fredoka text-2xl font-bold text-white mb-2">Team Owner</h2>
                <p class="text-zinc-500 text-sm mb-6">Access your team dashboard, view strategies, and track your remaining budget.</p>
                
                <div class="space-y-3 mt-auto">
                    <select id="team-select" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-white text-sm font-bold focus:border-emerald-500 outline-none">
                        <option value="">Loading teams...</option>
                    </select>
                    <input type="password" id="team-pass" placeholder="Password (Team Name)" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-white text-sm font-bold focus:border-emerald-500 outline-none">
                    <button onclick="loginTeam()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                        Login <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <div id="team-error" class="text-red-400 text-xs font-bold text-center hidden"></div>
                </div>
            </div>

            <!-- Admin -->
            <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl text-left flex flex-col h-full relative">
                <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-2xl mb-6">⚙️</div>
                <h2 class="fredoka text-2xl font-bold text-white mb-2">Auctioneer</h2>
                <p class="text-zinc-500 text-sm mb-6">Control the auction, manage the player pool, and setup categories.</p>
                
                <div class="space-y-3 mt-auto">
                    <input type="password" id="admin-pass" placeholder="Admin Password" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-white text-sm font-bold focus:border-amber-500 outline-none">
                    <button onclick="loginAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
                        Control Panel <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <div id="admin-error" class="text-red-400 text-xs font-bold text-center hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load teams on init
        fetch('/api/teams').then(r=>r.json()).then(data => {
            const select = document.getElementById('team-select');
            if(data && data.length > 0) {
                select.innerHTML = '<option value="">Select your team...</option>' + 
                    data.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            } else {
                select.innerHTML = '<option value="">No teams setup yet</option>';
            }
        }).catch(err => {
            document.getElementById('team-select').innerHTML = '<option value="">Error loading teams</option>';
        });

        async function doLogin(role, payload, errorElId) {
            const errEl = document.getElementById(errorElId);
            if(errEl) errEl.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({role, ...payload})
                });
                const data = await res.json();
                if(data.success) {
                    window.location.href = data.url;
                } else {
                    if(errEl) {
                        errEl.textContent = data.error || 'Login failed';
                        errEl.classList.remove('hidden');
                    } else alert(data.error);
                }
            } catch(e) {
                if(errEl) { errEl.textContent = 'Network error'; errEl.classList.remove('hidden'); }
            }
        }

        function loginSpectator() {
            doLogin('spectator', {}, null);
        }

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            doLogin('admin', {password: pass}, 'admin-error');
        }

        function loginTeam() {
            const teamId = document.getElementById('team-select').value;
            const pass = document.getElementById('team-pass').value;
            if(!teamId) {
                const err = document.getElementById('team-error');
                err.textContent = 'Please select a team';
                err.classList.remove('hidden');
                return;
            }
            doLogin('team', {team_id: teamId, password: pass}, 'team-error');
        }
    </script>
</body>
</html>
