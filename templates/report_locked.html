<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report locked</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #09090b; color: #e4e4e7;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 460px; text-align: center;
      background: #141417; border: 1px solid #27272a; border-radius: 20px;
      padding: 40px 34px;
    }
    .mark { font-size: 40px; margin-bottom: 18px; }
    h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: -.01em; }
    p { margin: 0 0 8px; color: #a1a1aa; font-size: 14px; line-height: 1.6; }
    .event { color: #f5b72e; font-weight: 600; }
    a {
      display: inline-block; margin-top: 24px; padding: 11px 22px;
      background: #f5b72e; color: #18181b; border-radius: 12px;
      font-weight: 700; font-size: 14px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">🔒</div>
    <h1>The report is not ready yet</h1>
    <p><span class="event">{{ auction.name }}</span> is still running.</p>
    <p>Click <strong>End Auction</strong> in the admin panel to close it. The report unlocks straight after, and the data stays available for 10 days.</p>
    <a href="/admin">Back to the auction</a>
  </div>
</body>
</html>
